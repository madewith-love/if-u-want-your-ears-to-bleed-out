<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>tonight.</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;400;500&display=swap');

    :root {
      --bg: #0b0b0d;
      --text: #eeeae5;
      --muted: #8f8b88;
      --soft: #bcb7b2;
      --line: rgba(255,255,255,0.09);
      --glow: rgba(180, 155, 255, 0.13);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* soft background glow */

    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: var(--glow);
      filter: blur(120px);
      border-radius: 50%;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* subtle grain */

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.035;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .page {
      width: min(90%, 520px);
      position: relative;
      z-index: 2;
      animation: appear 1.2s ease forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 70px;
    }

    .tiny {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #a995ff;
      border-radius: 50%;
      box-shadow: 0 0 12px #a995ff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }

    .main {
      text-align: center;
    }

    .eyebrow {
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(58px, 15vw, 92px);
      line-height: 0.9;
      font-weight: 300;
      letter-spacing: -0.07em;
      margin-left: -6px;
    }

    .subtitle {
      margin-top: 28px;
      color: var(--soft);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.8;
    }

    .time {
      margin-top: 38px;
      font-family: "DM Mono", monospace;
      font-size: 13px;
      color: var(--muted);
    }

    .wave {
      height: 32px;
      margin: 45px auto 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0.55;
    }

    .bar {
      width: 2px;
      height: 8px;
      background: #b5a7ff;
      border-radius: 10px;
      animation: wave 1.1s ease-in-out infinite;
    }

    .bar:nth-child(2) { animation-delay: .1s; }
    .bar:nth-child(3) { animation-delay: .2s; }
    .bar:nth-child(4) { animation-delay: .3s; }
    .bar:nth-child(5) { animation-delay: .4s; }
    .bar:nth-child(6) { animation-delay: .3s; }
    .bar:nth-child(7) { animation-delay: .2s; }
    .bar:nth-child(8) { animation-delay: .1s; }

    @keyframes wave {
      0%, 100% {
        height: 7px;
      }
      50% {
        height: 27px;
      }
    }

    .invite {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .invite-text {
      text-align: left;
    }

    .invite-text strong {
      display: block;
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .invite-text span {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .join {
      text-decoration: none;
      color: #111;
      background: #eeeae5;
      padding: 12px 17px;
      border-radius: 100px;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .join:hover {
      background: #b9aaff;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(169,149,255,0.15);
    }

    .footer {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      color: #5f5b59;
      font-family: "DM Mono", monospace;
      font-size: 9px;
    }

    /* mobile */

    @media (max-width: 500px) {
      .top {
        margin-bottom: 55px;
      }

      .subtitle {
        font-size: 14px;
      }

      .invite {
        align-items: flex-start;
      }

      .join {
        padding: 11px 14px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="top">
      <span class="tiny">a little note</span>

      <div class="status">
        <span class="dot"></span>
        <span class="tiny">around tonight</span>
      </div>
    </div>


    <section class="main">

      <div class="eyebrow">sunday / 27.09</div>

      <h1>tonight.</h1>

      <p class="subtitle">
        gonna be in vc for a bit.<br>
        probably singing. probably messing up.
      </p>

      <div class="time">
        08 : 00 PM
      </div>

      <div class="wave">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <div class="invite">

        <div class="invite-text">
          <strong>come hang if you're around</strong>
          <span>headphones recommended :)</span>
        </div>

        <!-- CHANGE THIS TO YOUR DISCORD INVITE -->
        <a
          class="join"
          href="https://discord.gg/YOUR-INVITE"
          target="_blank"
          rel="noopener noreferrer"
        >
          come hang →
        </a>

      </div>

    </section>


    <footer class="footer">
      <span>no pressure</span>
      <span>see you there</span>
    </footer>

  </main>

</body>
</html>
